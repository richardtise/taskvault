name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Foundry dependencies are vendored as git submodules under contracts/lib.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Solidity dependencies (fallback when lib/ is not vendored)
        working-directory: ./contracts
        run: |
          if [ -d lib ] && [ -n "$(ls -A lib)" ]; then
            echo "contracts/lib is populated; skipping forge install"
          else
            forge install
          fi

      - name: Build contracts
        working-directory: ./contracts
        run: forge build

      - name: Run contract tests
        working-directory: ./contracts
        run: forge test -vvv

  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/taskvault_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_only_test_secret_at_least_32_chars_long

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      # Vite inlines VITE_* at build time; placeholder addresses are enough to
      # prove the bundle compiles.
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_VAULT_ADDRESS: "0x0000000000000000000000000000000000000000"
          VITE_USDG_ADDRESS: "0x0000000000000000000000000000000000000000"
          VITE_ROBINHOOD_TESTNET_RPC: "https://rpc.testnet.chain.robinhood.com"
