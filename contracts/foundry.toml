[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 200
# getUserInfo returns 11 values; via_ir avoids stack-too-deep in callers/tests
# and produces better-optimised bytecode.
via_ir = true
# Pinned for reproducible builds. Satisfies the `pragma solidity ^0.8.20` in src/.
solc = "0.8.33"
evm_version = "shanghai"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api" }
