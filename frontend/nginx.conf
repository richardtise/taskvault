# TaskVault frontend reverse proxy.
#
# This file is the single source of nginx configuration. It is copied to
# /etc/nginx/conf.d/default.conf in the frontend image (see frontend/Dockerfile).
#
# The container runs unprivileged (nginxinc/nginx-unprivileged, uid 101), which
# cannot bind ports below 1024 and therefore listens on 8080. docker-compose.yml
# publishes it on host port 80.
#
# conf.d/*.conf files are included from the http{} context, so limit_req_zone
# (which is only valid in http{}) is allowed here.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# gzip for the static assets and API JSON responses.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx does NOT inherit add_header into a location that
    # declares its own add_header, so any such block repeats these (see the
    # static-asset location below).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend liveness endpoint: GET /health on the backend service.
    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;
        access_log off;
    }

    # API proxy. `^~` prevents the static-asset regex location below from
    # capturing paths such as /api/foo.js.
    #
    # proxy_pass intentionally has NO trailing slash: with no URI component nginx
    # forwards the original request URI unchanged, so /api/tasks reaches the
    # backend as /api/tasks. A trailing slash would rewrite it to /tasks and
    # 404 every API call.
    location ^~ /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;

        # "api" zone is declared at the top of this file (http context).
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    # Hashed build assets — safe to cache for a long time.
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        # Declaring add_header here disables inheritance of the server-level
        # headers, so repeat them to keep them on every response.
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
